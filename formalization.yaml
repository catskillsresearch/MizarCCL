# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "MizarCCL: the Mizar YELLOW/WAYBEL dependency closure in Lean"
  description: >-
    Ongoing 1–1 Lean 4 translation of the 368-article Mizar dependency
    closure of the YELLOW*/WAYBEL* continuous-lattice family. The
    current Comparator scaffold covers the foundational TARSKI article:
    extensionality, set constructors, regularity, Fraenkel, equipotence,
    and an explicitly weakened universe-polymorphic TG fragment whose
    lift is characterized by compared equality and membership laws.
    Registry submission is deferred until the full closure is complete,
    when one capstone theorem per seed will be selected. Account:
    view.pdf.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.LO, cs.LO]
  msc2020: ["03E30", "03B35", "68V20"]

status:
  scope: >-
    Substantive development of the full YELLOW*/WAYBEL* used-module
    closure (368 articles). Every Mizar-labelled item in each translated
    article is proved in `MizarCCL/`; Palomar registry validation is
    deferred until that queue is complete. The current Challenge.lean,
    Solution.lean, and comparator.json cover TARSKI only as an interim
    development scaffold. At submission, Comparator will compare one
    capstone theorem per seed (58 palomar_seeds entries), to be chosen
    after the queue is green. The TARSKI scaffold headline results are
    th1 (extensionality), th2 (regularity), sch1 (Fraenkel),
    ulift_eq_iff / ulift_mem_iff (an auditable membership embedding),
    and th3 (the explicitly weakened, universe-polymorphic
    Tarski–Grothendieck fragment). This foundational scaffold is not
    presented as meeting Palomar's research-interest threshold; that
    role is reserved for the eventual 58 capstones. `main_results`
    below is a curated six-result subset of the 14 mechanically
    compared scaffold theorems. Nothing in the compared statements is
    imported from a prior Palomar entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "TARSKI.th1"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "TARSKI.th2"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "TARSKI.sch1"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "TARSKI.ulift_eq_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "TARSKI.ulift_mem_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "TARSKI.th3"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Mizar’s single sort set is formalized as the defined type
    TarskiSet.{u} (Aczel pre-sets quotiented by extensional
    equivalence), not as a synonym for Type and not as an axiom.
    Membership is defined. TARSKI:3 is universe-polymorphic: the
    collection of all TarskiSet.{u} is an element of TarskiSet.{u+1},
    contains every lifted u-set, and is closed under subsets. The
    compared laws `ulift_eq_iff` and `ulift_mem_iff` establish that the
    recursive lift reflects equality and preserves and reflects
    membership; it cannot be a constant or otherwise unspecified map.
    Mizar clauses (iii) (a power-set witness) and (iv) (inaccessibility
    of a single sort) are not theorems of Type u and are not claimed.

sources:
  - title: "Tarski Grothendieck Set Theory"
    authors: ["Andrzej Trybulec"]
    type: "article"
    location: >-
      Mizar article TARSKI, received 1 January 1989. Source file
      vendor/mml/tarski.miz, copied from
      https://github.com/MizarSystem/MML/blob/047822c4d814630b28eec8ca6b455e9eb912d5ff/mml/tarski.miz
    relationship: adapts
    note: >-
      The article being translated. Lean proves TARSKI:1–2, def 1–6,
      and sch 1 over a defined TarskiSet model. TARSKI:3 is adapted
      to Lean universes (clauses (i)–(ii) and every u-set in M);
      Mizar (iii)–(iv) are not claimed. Licensed GPL-3.0-or-later OR
      CC-BY-SA-3.0 by the Association of Mizar Users. This package
      is a Lean 4 translation, not a Mizar checker run.

  - title: "Über unerreichbare Kardinalzahlen"
    authors: ["Alfred Tarski"]
    type: "article"
    location: "Fundamenta Mathematicae 30 (1938), 68–69"
    relationship: background
    note: >-
      Axiom of inaccessible sets. Mizar TARSKI:3 is the English form
      from Tarski 1939; this 1938 note is the German statement
      (A1–A4) cited in tarski.miz.

  - title: "On Well-ordered Subsets of any Set"
    authors: ["Alfred Tarski"]
    type: "article"
    location: "Fundamenta Mathematicae 32 (1939), 176–183"
    relationship: background
    note: >-
      Source of Mizar clauses (i)–(iv) of TARSKI:3. Background only;
      this package formalizes Trybulec’s Mizar article over a defined
      Lean model, not a line-by-line reading of the 1939 paper.

related_formalizations:
  - id: "https://github.com/MizarSystem/MML/tree/047822c4d814630b28eec8ca6b455e9eb912d5ff"
    relationship: other
    note: >-
      Upstream Mizar Mathematical Library (Mizar 7.13.01 / MML
      4.181.1147). Palomar tree vendors hidden.miz plus the 368-article
      used queue under vendor/mml at pin
      047822c4d814630b28eec8ca6b455e9eb912d5ff. No Lean was taken from
      MML. See vendor/README.md.

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Translated tarski.miz into MizarCCL/TARSKI.lean and packaged
        the Palomar Challenge / Solution / comparator /
        formalization.yaml kit and the arxiv.md write-up.
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every
        definition and claim, and takes sole responsibility for the
        mathematical content. No large language model is listed as a
        co-author.
  notes: >-
    Generated Lean was provisional until it compiled under the pinned
    toolchain (leanprover/lean4:v4.33.0). No Mathlib.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development as it was
    produced. No external or independent review has been performed.

known_gaps:
  - >-
    The 368-article translation is incomplete, so the 58 seed capstones
    have not yet been selected and this scaffold is not a registry
    submission candidate.
  - >-
    The Lean form of TARSKI:3 omits Mizar's single-sort power-set
    witness and inaccessibility clauses (iii)–(iv); only the explicitly
    characterized universe-polymorphic fragment is claimed.

limitations:
  - >-
    TARSKI:3 is formalized over Lean universes. Clauses (i)–(ii) and
    “every u-set is an element of M” are theorems, with the lift
    constrained by compared equality and membership laws. A power-set
    witness (iii) and the equipotence form of (iv) need Type u to be
    inaccessible, which Lean does not assume.
  - >-
    The current TARSKI family is a foundational development scaffold,
    not the eventual research-interest claim. Registry submission is
    deferred until the 368-article closure is complete and one
    substantive capstone has been selected from each of the 58 seeds.
  - >-
    Compared declarations may depend on propext, Quot.sound, and
    Classical.choice. Regularity and Fraenkel use choice. There is
    no sorry outside Challenge.lean, no project-defined axiom, and
    no native_decide.
  - >-
    Challenge.lean follows Palomar’s import rule: no project imports,
    Init-only surface with inlined carriers; compared statements use
    sorry. Solution.lean imports MizarCCL/TARSKI.lean for proofs.

